baseURL = 'https://personlin.github.io/portal/'
languageCode = 'zh-tw'
defaultContentLanguage = 'zh-tw'
title = 'Portal'
# This is a GitHub Project Pages site (https://personlin.github.io/portal/)
# so we must set the correct base path.
canonifyURLs = true
relativeURLs = false

theme = 'PaperMod'

[languages]
  [languages.zh-tw]
    languageName = '繁體中文'
    weight = 1

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      linkify = true

[params]
  author = '林柏伸 (Lin Po-Shen)'
  description = 'Personal portal'
  defaultTheme = 'auto'
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  # Open Graph / Twitter Card
  images = ['/share-image.png']

  # Social icons
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/personlin'
  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'
  # Uncomment and fill in your email:
  # [[params.socialIcons]]
  #   name = 'email'
  #   url = 'mailto:your-email@example.com'

  # Profile mode for a more welcoming home page
  [params.profileMode]
    enabled = true
    title = '林柏伸 (Lin Po-Shen)'
    subtitle = 'Earthquake Hazard & Disaster Prevention Researcher'
    imageUrl = '/share-image.png'
    imageWidth = 160
    imageHeight = 160
    imageTitle = 'Portal'
    buttons = [
      { name = 'Notes', url = '/notes/' },
      { name = 'Links', url = '/links/' },
      { name = 'Search', url = '/search/' }
    ]

  # Alternative: uncomment to use homeInfoParams instead
  # [params.homeInfoParams]
  #   Title = 'Portal'
  #   Content = 'Welcome. Use the menu for Links and Notes.'

  # Search configuration
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = ''
    weight = 1
  [[menu.main]]
    identifier = 'links'
    name = 'Links'
    url = 'links/'
    weight = 2
  [[menu.main]]
    identifier = 'notes'
    name = 'Notes'
    url = 'notes/'
    weight = 3
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = 'tags/'
    weight = 4
  [[menu.main]]
    identifier = 'categories'
    name = 'Categories'
    url = 'categories/'
    weight = 5
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = 'search/'
    weight = 6
